name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: -D warnings

jobs:
  c:
    name: C library
    runs-on: [hanzo-build-linux-amd64]
    env:
      CFLAGS: -g -Werror -Wall -Wextra -Wshadow -Wpedantic -Werror=incompatible-pointer-types
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang and cmake
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends clang cmake

      - name: Build with make
        run: make -j CFLAGS="$CFLAGS"

      - name: Build with cmake
        env:
          CC: clang
        run: |
          cmake -S lib -B build/static \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DTREE_SITTER_FEATURE_WASM=OFF
          cmake --build build/static --verbose

          cmake -S lib -B build/shared \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DTREE_SITTER_FEATURE_WASM=OFF
          cmake --build build/shared --verbose

  rust:
    name: CLI and tests
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the no_std build
        run: cargo check --no-default-features
        working-directory: lib

      - name: Build the CLI
        run: cargo build --release

      - name: Fetch grammar fixtures
        run: cargo run -p xtask -- fetch-fixtures

      - name: Generate grammar fixtures
        run: cargo run -p xtask -- generate-fixtures

      - name: Run tests
        run: |
          export TREE_SITTER="$PWD/target/release/tree-sitter"
          cargo test
